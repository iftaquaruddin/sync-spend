# =============================================================
# SyncSpend Pro • Production Docker Compose Configuration
#
# Quick Start:
#   docker compose up -d
#
# Logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
# =============================================================

services:
  syncspend:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncspend:latest
    container_name: syncspend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-syncspend-change-this-jwt-secret-in-production-2026}
      - DATA_DIR=/app/data
      # Optional: Public IP or domain name for announced Wi-Fi connection URL
      # - SERVER_HOST=192.168.1.100
    volumes:
      # Persistent named volume storing expenses.db and uploaded bill photos
      - syncspend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  syncspend_data:
    name: syncspend_data
